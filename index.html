<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="description" content="Crie seu visual, explore um parque acolhedor e aprenda sobre honestidade, empatia e gentileza em My Town, My World." />
    <meta name="theme-color" content="#b58cf5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>My Town, My World</title>
    <style>
      @font-face { font-family: 'Fredoka'; src: url('./assets/fontes/Fredoka.ttf') format('truetype'); font-weight: 300 700; font-display: block; }
      html, body { margin: 0; height: 100%; background: #2b1f45; overflow: hidden; touch-action: manipulation; }
      #jogo { position: fixed; left: env(safe-area-inset-left); right: env(safe-area-inset-right); top: env(safe-area-inset-top); height: calc(var(--altura-visivel, 100dvh) - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
      #jogo canvas { touch-action: none; }
      form { touch-action: pan-y; }
      input { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <noscript><p style="position:relative;z-index:1;margin:2rem;color:#ffffff;text-align:center;font-family:Arial,sans-serif">Para brincar em My Town, My World, ative o JavaScript no navegador. Peça ajuda a um responsável e volte para o parque!</p></noscript>
    <div id="jogo"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
